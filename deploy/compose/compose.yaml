# Local development dependencies (LLD-12 §3, E2.2). This is the `core`
# profile only: the infrastructure M2 needs before any service code runs.
# The `app` profile (bff + domain services) is added once there is business
# logic worth containerizing.
#
# Run from the repo root: `make dev` (see root Makefile), or directly:
#   docker compose -f deploy/compose/compose.yaml --env-file .env up -d

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: scaleforge
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-schemas.sh:/docker-entrypoint-initdb.d/10-init-schemas.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scaleforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    # Dev-only DB browser (not in LLD-12 §3; added for local convenience).
    # Log in as `postgres` / POSTGRES_SUPERUSER_PASSWORD to see every schema,
    # or as a `svc_<name>` role / POSTGRES_APP_PASSWORD to see just its own.
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  redis-session:
    # Sessions (ADR-0010): AOF persistence, no eviction. Sentinel is a
    # Kubernetes-only concern (LLD-12 §4); local Compose runs one instance.
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-session-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cache:
    # Cache/rate-limit/pub-sub (ADR-0010): no persistence, rebuildable.
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--health-enabled=true"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Without these, Keycloak falls back to its own embedded, ephemeral H2
      # store — the realm (and this `keycloak` Postgres DB/role that
      # init-schemas.sh already provisions) silently goes unused, and a
      # container restart wipes every client/user. Confirmed by a restart
      # losing the whole scaleforge realm, 2026-10-18.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "8081:8080" # app port; avoids clashing with a local port 8080
      - "9000:9000" # management/health port
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nconnection: close\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  keycloak-config-cli:
    # Applies deploy/compose/keycloak/realm-scaleforge.json via the Admin
    # REST API (LLD-01 §3) so client secrets stay in .env, substituted into
    # the realm file's $(VAR) placeholders at apply time, never on disk (see
    # deploy/compose/keycloak/README.md for why it's $(VAR) and not ${VAR}).
    # Pinned to the build published for Keycloak 26.0.x: `latest` resolved to
    # a 26.5-targeted build against our pinned 26.0.8 server and failed with
    # an opaque 400 on realm creation (confirmed 2026-10-18).
    image: adorsys/keycloak-config-cli:6.5.1-26.0.5
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: "120s"
      IMPORT_FILES_LOCATIONS: /config/realm-scaleforge.json
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      SF_BFF_CLIENT_SECRET: ${SF_BFF_CLIENT_SECRET}
      SF_SVC_BFF_CLIENT_SECRET: ${SF_SVC_BFF_CLIENT_SECRET}
      SF_SVC_USERS_CLIENT_SECRET: ${SF_SVC_USERS_CLIENT_SECRET}
      SF_SVC_ORGS_CLIENT_SECRET: ${SF_SVC_ORGS_CLIENT_SECRET}
      SF_SVC_AUTHZ_CLIENT_SECRET: ${SF_SVC_AUTHZ_CLIENT_SECRET}
      SF_USERS_ADMIN_CLIENT_SECRET: ${SF_USERS_ADMIN_CLIENT_SECRET}
      SF_AUTHZ_ADMIN_CLIENT_SECRET: ${SF_AUTHZ_ADMIN_CLIENT_SECRET}
      E2E_TEST_USER_PASSWORD: ${E2E_TEST_USER_PASSWORD}
    volumes:
      - ./keycloak/realm-scaleforge.json:/config/realm-scaleforge.json:ro
    restart: "no"

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq-topology:
    # Declares exchanges, queues, and bindings (ADR-0003, LLD-08 §2) via the
    # management HTTP API, against the real broker credentials, instead of a
    # mounted definitions.json — that approach silently disables RabbitMQ's
    # own RABBITMQ_DEFAULT_USER seeding (see git history / commit message
    # for the incident this replaced).
    #
    # Everything here runs on the default `/` vhost under the single shared
    # admin credential pair. Per-service RabbitMQ users/vhosts (LLD-08 §2's
    # "one RabbitMQ user per service") are a deliberate, already-agreed
    # deferral to a future ADR-0003 revisit, not an oversight.
    image: curlimages/curl:8.11.0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        AUTH="-u $$RABBITMQ_DEFAULT_USER:$$RABBITMQ_DEFAULT_PASS"
        API=http://rabbitmq:15672/api

        # Exchanges (ADR-0003): sf.events carries facts, sf.commands carries
        # requests with one intended consumer (nothing publishes to it yet).
        curl -sf $$AUTH -X PUT "$$API/exchanges/%2F/sf.events" \
          -H 'content-type: application/json' \
          -d '{"type":"topic","durable":true}'
        curl -sf $$AUTH -X PUT "$$API/exchanges/%2F/sf.commands" \
          -H 'content-type: application/json' \
          -d '{"type":"topic","durable":true}'

        # q.authz.identity (E2.8): the only real consumer queue this
        # milestone needs. DLQ first, since the main queue's
        # x-dead-letter-routing-key names it.
        curl -sf $$AUTH -X PUT "$$API/queues/%2F/q.authz.identity.dlq" \
          -H 'content-type: application/json' \
          -d '{"durable":true,"arguments":{"x-queue-type":"quorum"}}'
        curl -sf $$AUTH -X PUT "$$API/queues/%2F/q.authz.identity" \
          -H 'content-type: application/json' \
          -d '{"durable":true,"arguments":{"x-queue-type":"quorum","x-delivery-limit":10,"x-dead-letter-exchange":"","x-dead-letter-routing-key":"q.authz.identity.dlq"}}'

        # Bindings for q.authz.identity (LLD-08 §2.1).
        for key in "membership.*.v1" "organization.*.v1" "user.created.v1" "user.disabled.v1" "user.reactivated.v1"; do
          curl -sf $$AUTH -X POST "$$API/bindings/%2F/e/sf.events/q/q.authz.identity" \
            -H 'content-type: application/json' \
            -d "{\"routing_key\":\"$$key\"}"
        done

        # q.audit.ingest (E2.9): audit-svc consumes audit.recorded.v1 events.
        curl -sf $$AUTH -X PUT "$$API/queues/%2F/q.audit.ingest.dlq" \
          -H 'content-type: application/json' \
          -d '{"durable":true,"arguments":{"x-queue-type":"quorum"}}'
        curl -sf $$AUTH -X PUT "$$API/queues/%2F/q.audit.ingest" \
          -H 'content-type: application/json' \
          -d '{"durable":true,"arguments":{"x-queue-type":"quorum","x-delivery-limit":10,"x-dead-letter-exchange":"","x-dead-letter-routing-key":"q.audit.ingest.dlq"}}'
        curl -sf $$AUTH -X POST "$$API/bindings/%2F/e/sf.events/q/q.audit.ingest" \
          -H 'content-type: application/json' \
          -d '{"routing_key":"audit.recorded.v1"}'
    restart: "no"

  mailpit:
    # TODO: pin an exact release once verified against Docker Hub; `latest`
    # is used because this sandbox has no network/Docker access to confirm
    # one (see docs/architecture/lld/12-platform-deployment.md §2).
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP
    # No healthcheck: the image is a minimal static binary (no shell/wget
    # confirmed), and nothing else in this stack depends on mailpit's health.

  jaeger:
    # Temporary trace viewer (delivery plan M2 §3, E2.2). Replaced by the
    # full Collector + Tempo stack in E6.1.
    # TODO: pin an exact release once verified; see the mailpit note above.
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    # No healthcheck: same reasoning as mailpit above.

volumes:
  pgdata:
  redis-session-data:
  rabbitmq-data:

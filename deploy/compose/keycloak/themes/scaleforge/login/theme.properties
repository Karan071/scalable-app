# ScaleForge login theme (apps/web's own SignInPrompt theme: warm ivory /
# emerald / vermilion). Extends keycloak.v2 rather than replacing its
# templates -- only resources/css/styles.css is overridden, loaded after
# keycloak.v2's own stylesheet (confirmed by inspecting a real rendered
# login page: <link ... keycloak.v2/css/styles.css> is the last stylesheet
# in <head>, so this file's rules win without !important).
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Listed explicitly: a `rules/*.yml` glob would also load the promtool
# test files (`*.test.yml`), which aren't rule files.
rule_files:
  - /etc/prometheus/rules/messaging.yml

scrape_configs:
  - job_name: otel-collector
    # Keep the job/instance labels the Collector derives from each
    # service's OTel resource, instead of overwriting them with this job.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  # Per-queue depth for queue_depth/dlq_depth (LLD-08 §13). The plugin's
  # plain /metrics aggregates across queues; this family is per queue.
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]

[project]
name = "sf-common"
version = "0.1.0"
description = "Shared settings, logging, HTTP helpers, problem details, crypto, and health endpoints. No domain logic."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "cryptography>=43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sf_common"]

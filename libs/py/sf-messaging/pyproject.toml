[project]
name = "sf-messaging"
version = "0.1.0"
description = "Envelope, transactional outbox writer, outbox relay, and inbox-based consumer base (LLD-08)."
requires-python = ">=3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "aio-pika>=9.4,<10",
  "asyncpg>=0.29",
  "opentelemetry-api>=1.45",
  # Recognizing a transient outbound-call failure (retry.py, LLD-08 §7) --
  # every consumer handler in this codebase already uses httpx for its own
  # outbound calls, so this isn't a new dependency class for the workspace.
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sf_messaging"]

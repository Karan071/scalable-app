[project]
name = "scaleforge"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "libs/py/*"]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  # Real-browser system tests (LLD-14 §10, LLD-15 §10): tests/system/
  # test_checkout_browser.py, driven directly via playwright.async_api
  # (not the pytest-playwright plugin's sync fixtures, which would mean
  # a second, unrelated event loop alongside the rest of tests/system's
  # pytest-asyncio one). Everything else in tests/system drives the real
  # Keycloak login at the HTTP layer (keycloak.py's own Browser) -- this
  # is the one suite that needs an actual rendered page.
  "playwright>=1.47",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI idiom: Depends(...)/Query(...)/etc. in a default are meant to be called there.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "sf_authz.Internal",
  "sf_authz.AuthenticatedUser",
  "sf_authz.Public",
  "sf_authz.Authorize",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
# Needed once a Settings subclass has required fields with no default
# (pydantic-settings fills them from the environment at runtime, but mypy
# can't see that without this plugin): confirmed on users-svc's Settings.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# None of these ship a py.typed marker or stubs.
module = ["casbin", "casbin_sqlalchemy_adapter", "asyncpg"]
ignore_missing_imports = true

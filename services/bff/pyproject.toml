[project]
name = "scaleforge-bff"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "redis>=5.0",
  "aio-pika>=9.4,<10",
  "sf-common",
  "sf-authz",
]

[tool.uv.sources]
sf-common = { workspace = true }
sf-authz = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

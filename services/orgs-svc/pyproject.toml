[project]
name = "scaleforge-orgs-svc"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "alembic>=1.13",
  "httpx>=0.27",
  "sf-common",
  "sf-db",
  "sf-authz",
  "sf-messaging",
]

[tool.uv.sources]
sf-common = { workspace = true }
sf-db = { workspace = true }
sf-authz = { workspace = true }
sf-messaging = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
